name: Deploy Academy Frontend

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # See deploy-backend.yml for the key setup this relies on: a
      # trigger-only key whose authorized_keys entry forces
      # academy-deploy-dispatch.sh, which itself only ever runs
      # platform/deploy/scripts/deploy-frontend.sh for the literal string
      # "frontend" sent below.
      - name: Trigger deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: frontend
