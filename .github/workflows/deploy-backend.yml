name: Deploy Academy Backend

on:
  push:
    branches: [master]
    paths:
      - "platform/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  # Runs the platform/tests/ suite (see its own docstring/README "Testing")
  # against real Postgres+Redis on the runner, the same way `make test`
  # already does locally -- deploy below never ran this, so a regression
  # only ever got caught after it was already live (see e.g. the string of
  # lesson-recorder fix commits). Gating deploy on this doesn't touch the
  # production server at all if it fails.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run backend test suite
        working-directory: platform
        run: |
          cp .env.example .env
          make test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          # SSH_HOST must be the server's raw IP (or a DNS record NOT
          # proxied through Cloudflare) — Cloudflare doesn't proxy port 22.
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          # Key auth, not SSH_PASSWORD -- the server has password auth
          # disabled. SSH_PRIVATE_KEY must hold the matching private key
          # (the whole file, e.g. `gh secret set SSH_PRIVATE_KEY < id_rsa`);
          # SSH_PASSWORD can be removed once this is confirmed working.
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            set -e
            cd /EduBridge_Academy_1.0.0
            git pull origin master
            cd platform
            # --profile full also starts MinIO (avatar photo storage) —
            # everything else runs fine without it, but the tutor photo
            # upload feature needs it.
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile full up -d --build
            # Every department already runs `alembic upgrade head` itself
            # on startup (entrypoint.sh) — no separate migration step here.
            echo "Waiting for the gateway to come up..."
            # Single-vCPU host rebuilding 6 services under memory pressure —
            # a short retry budget here reports a false failure even though
            # the stack comes up fine a bit later (observed: healthy ~30s
            # after a 100s budget ran out), so this is deliberately generous.
            for i in $(seq 1 40); do
              if curl -fsS -m 5 http://127.0.0.1:8091/api/auth/health > /dev/null 2>&1; then
                echo "Backend is healthy"
                break
              fi
              if [ "$i" -eq 40 ]; then
                echo "Backend did not become healthy in time"
                docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile full logs --tail 50
                exit 1
              fi
              echo "Attempt $i/40, retrying in 10s..."
              sleep 10
            done
            docker image prune -f
