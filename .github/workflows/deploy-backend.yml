name: Deploy Academy Backend

on:
  push:
    branches: [master]
    paths:
      - "platform/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  # Runs the platform/tests/ suite (see its own docstring/README "Testing")
  # against real Postgres+Redis on the runner, the same way `make test`
  # already does locally -- deploy below never ran this, so a regression
  # only ever got caught after it was already live (see e.g. the string of
  # lesson-recorder fix commits). Gating deploy on this doesn't touch the
  # production server at all if it fails.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run backend test suite
        working-directory: platform
        run: |
          cp .env.example .env
          make test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # DEPLOY_SSH_KEY is a dedicated trigger-only key, not the server's
      # real root key: its authorized_keys entry forces
      # /usr/local/bin/academy-deploy-dispatch.sh regardless of what's sent
      # here, so even a leaked copy of this secret can only ever run
      # platform/deploy/scripts/deploy-backend.sh on the server (which
      # itself pulls via a SEPARATE, read-only deploy key) — never an
      # arbitrary shell. See DEPLOY.md for the full key setup. Same pattern
      # as edubridge-crm's ci-cd.yml.
      - name: Trigger deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          # Whatever's sent here becomes $SSH_ORIGINAL_COMMAND on the
          # server, which the forced dispatcher matches against an
          # allowlist (see academy-deploy-dispatch.sh) — the actual deploy
          # logic (git pull, docker compose up --build, health-check
          # retries, image prune) lives server-side in deploy-backend.sh,
          # not inline here, so the forced command can stay a fixed string.
          script: backend
