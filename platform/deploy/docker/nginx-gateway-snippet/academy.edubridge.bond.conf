# ── EduBridge Academy (academy.edubridge.bond) ──────────────────────────────
#
# This file is NOT loaded by anything in this repo. It's the server block
# that needs to be appended to a DIFFERENT project's config — the shared
# nginx gateway that already terminates TLS for edubridge.bond and
# university.edubridge.bond, living in the sibling "Job" project's repo at
# /EduBridge_Job_1.0.0/client/nginx.prod.conf on the server. See
# platform/deploy/docs/DEPLOY.md for the exact steps (append this block,
# rebuild+restart that one container, issue the cert) — that step touches
# infrastructure shared with two other live projects, so it's done by hand
# with a human watching, not by any script in this repo.

server {
    listen 80;
    server_name academy.edubridge.bond;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name academy.edubridge.bond;

    ssl_certificate /etc/letsencrypt/live/academy.edubridge.bond/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/academy.edubridge.bond/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    server_tokens off;
    client_max_body_size 600M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Our own Traefik (see platform/deploy/docker/traefik/dynamic.yml)
    # already splits `/` (frontend) vs `/api/<prefix>/*` (the 6 backend
    # departments) internally, so this shared nginx only needs one upstream
    # for the whole app: our Traefik container on the edubridge-net network
    # it already joins (see platform/docker-compose.prod.yml). Upgrade/
    # Connection headers matter here, not just for cosmetics — engagement's
    # WebSocket endpoints (/api/chat/ws/{id}, /api/notifications/ws) need
    # them to work at all.
    location / {
        proxy_pass http://academy_traefik:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}
