# Auto-generated Traefik dynamic config (file provider).
# Routes /api/<prefix>/* -> http://<department>:8000, stripping /api.
#
# One router per legacy route prefix, so the public API surface is
# unchanged; each router's `service` names a department, which is
# what actually moved when the original microservices merged into
# department deployables.
http:
  middlewares:
    strip-api:
      stripPrefix:
        prefixes:
          - /api
  routers:
    auth:
      rule: "PathPrefix(`/api/auth`)"
      service: identity
      entryPoints:
        - web
      middlewares:
        - strip-api
    users:
      rule: "PathPrefix(`/api/users`)"
      service: identity
      entryPoints:
        - web
      middlewares:
        - strip-api
    chat:
      rule: "PathPrefix(`/api/chat`)"
      service: engagement
      entryPoints:
        - web
      middlewares:
        - strip-api
    notifications:
      rule: "PathPrefix(`/api/notifications`)"
      service: engagement
      entryPoints:
        - web
      middlewares:
        - strip-api
    support:
      rule: "PathPrefix(`/api/support`)"
      service: engagement
      entryPoints:
        - web
      middlewares:
        - strip-api
    cms:
      rule: "PathPrefix(`/api/cms`)"
      service: content
      entryPoints:
        - web
      middlewares:
        - strip-api
    localization:
      rule: "PathPrefix(`/api/localization`)"
      service: content
      entryPoints:
        - web
      middlewares:
        - strip-api
    ai:
      rule: "PathPrefix(`/api/ai`)"
      service: content
      entryPoints:
        - web
      middlewares:
        - strip-api
    storage:
      rule: "PathPrefix(`/api/storage`)"
      service: content
      entryPoints:
        - web
      middlewares:
        - strip-api
    admin:
      rule: "PathPrefix(`/api/admin`)"
      service: backoffice
      entryPoints:
        - web
      middlewares:
        - strip-api
    analytics:
      rule: "PathPrefix(`/api/analytics`)"
      service: backoffice
      entryPoints:
        - web
      middlewares:
        - strip-api
    leads:
      rule: "PathPrefix(`/api/leads`)"
      service: backoffice
      entryPoints:
        - web
      middlewares:
        - strip-api
    courses:
      rule: "PathPrefix(`/api/courses`)"
      service: academics
      entryPoints:
        - web
      middlewares:
        - strip-api
    calendar:
      rule: "PathPrefix(`/api/calendar`)"
      service: calendar
      entryPoints:
        - web
      middlewares:
        - strip-api
    frontend:
      rule: "PathPrefix(`/`)"
      service: frontend
      entryPoints:
        - web
      # Explicit low priority so the API routers always win.
      priority: 1
  services:
    academics:
      loadBalancer:
        servers:
          - url: "http://academics:8000"
    calendar:
      loadBalancer:
        servers:
          - url: "http://calendar:8000"
    backoffice:
      loadBalancer:
        servers:
          - url: "http://backoffice:8000"
    content:
      loadBalancer:
        servers:
          - url: "http://content:8000"
    engagement:
      loadBalancer:
        servers:
          - url: "http://engagement:8000"
    identity:
      loadBalancer:
        servers:
          - url: "http://identity:8000"
    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:3000"
