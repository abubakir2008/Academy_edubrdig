# ==========================================================================
# EduBridge Platform - sized for a 4 GB / 13 GB VPS.
#
# This file alone is production-safe (no published ports beyond what
# `docker-compose.prod.yml` adds for Traefik's loopback bind) but has no
# entrypoint into the stack — local dev needs `docker-compose.override.yml`
# (auto-loaded) for that. See deploy/docs/DEPLOY.md for both dev and
# production run instructions, and `../frontend/docker-compose.yml` for the
# frontend, which is deployed independently of this file.
#
# Consolidated from 22 microservices + ElasticSearch + Kafka + MongoDB +
# RabbitMQ down to department services (identity, engagement, content,
# backoffice, academics, calendar) + Postgres + Redis (+ optional MinIO/MailHog).
# chat/notifications/support moved from MongoDB to Postgres (engagement
# department); the event bus is Redis Streams instead of Kafka (see
# shared/edubridge_shared/events.py). mem_limit is set on every service so
# the whole stack has a hard ceiling well under 4 GB.
# ==========================================================================

x-app-env: &app-env
  env_file: .env

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-department: &department
  build:
    context: .
    dockerfile: Dockerfile
  <<: *app-env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  mem_limit: 300m
  restart: unless-stopped
  logging: *default-logging
  networks: [edubridge]

services:
  # ----------------------------- Gateway --------------------------------
  # No `ports:` here on purpose — this compose file is production-safe by
  # default. Local dev publishes :80/:8080 via docker-compose.override.yml
  # (auto-loaded when you run `docker compose up` with no -f flags); a
  # production deploy passes `-f docker-compose.yml -f
  # docker-compose.prod.yml` explicitly, which does NOT auto-load
  # override.yml, and instead binds Traefik to loopback-only for the host's
  # existing shared reverse proxy to sit in front of — see
  # docker-compose.prod.yml and deploy/docs/DEPLOY.md.
  traefik:
    image: traefik:v3.2
    command:
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
    volumes:
      - ./deploy/docker/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    mem_limit: 64m
    restart: unless-stopped
    logging: *default-logging
    networks: [edubridge]

  # --------------------------- Infrastructure ---------------------------
  # One Postgres database for the whole platform; each department gets its
  # own schema (see shared/edubridge_shared/database.py) instead of its own
  # database, so there's one connection pool budget to reason about, not 15.
  # No `ports:` on postgres/redis/minio either — same reasoning as Traefik
  # above. Reach Postgres in prod via `docker compose exec postgres psql`
  # (or an SSH tunnel), never a published host port.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-edubridge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 320m
    restart: unless-stopped
    logging: *default-logging
    networks: [edubridge]

  redis:
    image: redis:7-alpine
    # Also backs the event bus (Redis Streams) and realtime pub/sub now, on
    # top of its original job as the refresh-token / rate-limit store.
    # --appendonly: survives a container restart instead of silently
    # dropping refresh tokens / pending stream entries every redeploy.
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    mem_limit: 128m
    restart: unless-stopped
    logging: *default-logging
    networks: [edubridge]

  # Object storage for avatars/certificates/materials — optional; the
  # content department only touches this if the `storage` route is used.
  minio:
    image: minio/minio:latest
    profiles: ["full"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    mem_limit: 200m
    restart: unless-stopped
    logging: *default-logging
    networks: [edubridge]

  # Dev SMTP catcher — web UI at http://localhost:8025, SMTP at mailhog:1025.
  # Always on (not profiled): Engagement depends on it directly for the
  # notification-email path, and at 64 MB it isn't worth gating.
  #
  # axllent/mailpit, not mailhog/mailhog: the original MailHog image is
  # amd64-only (no manifest list), so it fails with "exec format error" on
  # an arm64 Docker host (this dev machine) without emulation. Mailpit is a
  # maintained, multi-arch MailHog-compatible replacement — same SMTP/web
  # ports and API — so nothing else in the compose file needed to change.
  mailhog:
    image: axllent/mailpit:latest
    mem_limit: 64m
    restart: unless-stopped
    logging: *default-logging
    networks: [edubridge]

  # ---------------------------- Departments ------------------------------
  identity:
    <<: *department
    environment:
      DEPARTMENT: identity
    labels:
      - "traefik.enable=true"

  engagement:
    <<: *department
    environment:
      DEPARTMENT: engagement
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mailhog:
        condition: service_started
    mem_limit: 300m
    networks: [edubridge]

  content:
    <<: *department
    environment:
      DEPARTMENT: content

  backoffice:
    <<: *department
    environment:
      DEPARTMENT: backoffice

  academics:
    <<: *department
    environment:
      DEPARTMENT: academics

  calendar:
    <<: *department
    environment:
      DEPARTMENT: calendar

  # Watches calendar.lessons for lessons currently in their scheduled
  # window and records each one itself (joins the LiveKit room, uploads to
  # RECORDINGS_S3_*) — see platform/lesson-recorder/. Own image (needs
  # ffmpeg + the LiveKit realtime SDK, not shared with the department
  # image). Same `full` profile as MinIO: needs real RECORDINGS_S3_*
  # credentials to do anything, so it's opt-in the same way avatar storage
  # is — idles harmlessly if those are unset (see watcher.py).
  recorder:
    build:
      context: ./lesson-recorder
      dockerfile: Dockerfile
    <<: *app-env
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    # Video encoding is genuinely CPU-heavy — that cap is enforced in code
    # (MAX_CONCURRENT_RECORDINGS) so this service never runs more than a
    # couple of encodes at once. Memory has to be budgeted for the same
    # number: each in-flight lesson is a Python process holding the latest
    # frame per track, one x264 encoder, and a small aac encoder per
    # microphone — roughly 500m per concurrent recording, plus the watcher.
    # Raise this alongside MAX_CONCURRENT_RECORDINGS or recordings get
    # OOM-killed mid-lesson.
    mem_limit: 2g
    # Docker's default (10s) isn't enough to let watcher.py's SIGTERM
    # handler drain active recordings (ffmpeg finalize + the S3 upload) --
    # it would just get SIGKILLed mid-drain on every deploy, losing whatever
    # lesson was recording. Matches SHUTDOWN_DRAIN_SECONDS in watcher.py.
    stop_grace_period: 3m
    restart: unless-stopped
    logging: *default-logging
    networks: [edubridge]

# The frontend (Next.js) is its own deployable now — see `../frontend/docker-compose.yml`
# — so it can be redeployed independently of the backend instead of being
# rebuilt on every backend change. It joins this same `academy-internal`
# network (by real name, `external: true` on its side) so Traefik can still
# reach it at `http://frontend:3000`, exactly as `dynamic.yml` expects.
# Bring this stack up first — it's the one that creates the network.
networks:
  edubridge:
    name: academy-internal
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
