[project]
name = "edubridge-shared"
version = "0.1.0"
description = "Shared library for the EduBridge department services"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "python-json-logger>=2.0",
    "redis>=5.2",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["edubridge_shared*"]
